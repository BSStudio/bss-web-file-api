[project]
name = "bss-web-file-server"
version = "1.0.0"
description = "BSS file server API"
authors = [{ name = "Bence Csik", email = "22349790+csikb@users.noreply.github.com" }]
requires-python = "==3.15.0"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.159.1",
    "pillow==13.0.0",
    "pydantic-settings==2.16.1",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "isort==9.0.2",
    "mypy==2.4.0",
    "pylint==4.1.3",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "testcontainers==4.15.0",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"
module-name = ["bss_web_file_server"]

[tool.pytest]
addopts = [
    "--import-mode=importlib",
]

[tool.isort]
profile = "black"

[tool.mypy]
packages = "src"
