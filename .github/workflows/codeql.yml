name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  schedule:
    # weekly re-scan, so newly released queries run against unchanged code too
    - cron: "23 4 * * 1"
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
      security-events: write # to upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, python ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
