# The hooks run the tools from uv.lock, the same versions CI runs.
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: isort
        name: isort
        entry: uv run --locked isort
        language: system
        types: [python]
      - id: black
        name: black
        entry: uv run --locked black
        language: system
        types: [python]
